<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensei — AI Tutor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; max-width: 600px; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #fff; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .status { margin-top: 2rem; padding: 1rem; border-radius: 8px; background: #1a1a2e; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4caf50; margin-right: 8px; }
    .status-dot.offline { background: #f44336; }
    #log { margin-top: 1.5rem; text-align: left; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; padding: 1rem; background: #111; border-radius: 8px; }
    .event { padding: 0.25rem 0; border-bottom: 1px solid #222; }
    .event .type { color: #64b5f6; font-weight: bold; }
    .event .text { color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sensei</h1>
    <p class="subtitle">AI Tutor — Voice Assistant</p>
    <div class="status">
      <span class="status-dot" id="dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
    <div id="log"></div>
  </div>
  <script>
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const log = document.getElementById('log');

    function addEvent(type, text) {
      const el = document.createElement('div');
      el.className = 'event';
      el.innerHTML = `<span class="type">${type}</span> <span class="text">${text || ''}</span>`;
      log.prepend(el);
      if (log.children.length > 50) log.lastChild.remove();
    }

    const es = new EventSource('/voice/stream');
    es.onopen = () => {
      dot.className = 'status-dot';
      statusText.textContent = 'Connected — listening for events';
    };
    es.onerror = () => {
      dot.className = 'status-dot offline';
      statusText.textContent = 'Disconnected';
    };
    es.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        addEvent(data.type, data.text || '');
        if (data.type === 'listening' || data.type === 'daemon_start') {
          statusText.textContent = data.text || 'Listening...';
        } else if (data.type === 'thinking') {
          statusText.textContent = 'Thinking...';
        } else if (data.type === 'reply') {
          statusText.textContent = 'Speaking...';
        }
      } catch {}
    };
  </script>
</body>
</html>
